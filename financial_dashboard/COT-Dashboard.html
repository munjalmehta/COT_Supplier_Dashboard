<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<title>Chutney on Top — Accounting Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#0e1015; --card:#151822; --border:#262b38; --text:#e9edf3; --muted:#8b93a3;
    --accent:#22c58f; --accent-dim:#1a8c67; --danger:#e2574c; --mono:'JetBrains Mono',monospace;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif;}
  .app{max-width:1100px;margin:0 auto;padding:24px;}
  h1{font-size:20px;font-weight:600;margin:0 0 4px;}
  .sub{color:var(--muted);font-size:13px;margin:0 0 20px;}
  .tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .tab{padding:10px 16px;font-size:14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--text);border-color:var(--accent);}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:14px 16px;}
  .card .label{font-size:12px;color:var(--muted);margin-bottom:6px;}
  .card .value{font-size:22px;font-weight:600;}
  .card .value.small{font-size:15px;}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;color:var(--muted);font-weight:500;padding:8px 10px;border-bottom:1px solid var(--border);}
  td{padding:8px 10px;border-bottom:1px solid var(--border);}
  tr:hover td{background:#1a1e28;}
  .pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;}
  .pill.in{background:#123d2c;color:var(--accent);}
  .pill.out{background:#3a1f1c;color:#f08a80;}
  .right{text-align:right;font-family:var(--mono);}
  .section{display:none;}
  .section.active{display:block;}
  button{background:var(--accent);color:#04211a;border:none;border-radius:6px;padding:9px 16px;font-size:13px;font-weight:600;cursor:pointer;}
  button.ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .row{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap;}
  select,input[type=date]{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:6px;font-size:13px;}
  .notice{background:#241d10;border:1px solid #4a3a17;color:#e0b04c;padding:10px 14px;border-radius:8px;font-size:13px;margin-bottom:16px;}
  .chart-wrap{position:relative;height:280px;margin-bottom:24px;}
  .empty{color:var(--muted);font-size:13px;padding:20px 0;}
</style>
</head>

let SEED = FALLBACK_SEED;

const GH_BASE = "https://raw.githubusercontent.com/munjalmehta/COT_Supplier_Dashboard/main/financial_dashboard/";
async function loadLive() {
  try {
    const [manifest, wolt, ubereats, lieferando, kassenbuch] = await Promise.all(
      ["manifest.json","wolt_periods.json","ubereats_periods.json","lieferando_periods.json","kassenbuch.json"]
      .map(f => fetch(GH_BASE + f + "?t=" + Date.now()).then(r => { if(!r.ok) throw new Error(f); return r.json(); }))
    );
    SEED = { manifest, wolt, ubereats, lieferando, kassenbuch };
    document.getElementById("liveBadge").textContent = "live from GitHub";
    document.getElementById("liveBadge").style.color = "var(--accent)";
  } catch (e) {
    SEED = FALLBACK_SEED;
    document.getElementById("liveBadge").textContent = "offline snapshot (fetch failed: " + e.message + ")";
    document.getElementById("liveBadge").style.color = "#e0b04c";
  }
  renderDashboard(); renderKassenbuch(); renderDatev(); renderSources();
}

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.section').forEach(x=>x.classList.remove('active'));
  t.classList.add('active');
  document.getElementById(t.dataset.tab).classList.add('active');
}));

function eur(n){ return '€' + n.toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}); }

// ---------- Dashboard ----------
function renderDashboard(){
  const el = document.getElementById('dashboard');
  const wolt = SEED.wolt, ue = SEED.ubereats, lf = SEED.lieferando;
  const woltGross = wolt.reduce((s,p)=>s+p.goods_gross+p.deliveries_gross+p.service_gross+p.discounts_gross+p.purchase_corr_gross+p.deductions_gross,0);
  const ueGross = ue.reduce((s,p)=>s+p.gross_after_discount,0);
  const lfGross = lf.reduce((s,p)=>s+p.period_total_revenue,0);
  const total = woltGross+ueGross+lfGross;

  el.innerHTML = `
    <div class="notice">SumUp (dine-in, ~3–4× delivery revenue on most days) isn't parsed yet — see Data sources tab. Figures below are delivery platforms only.</div>
    <div class="grid">
      <div class="card"><div class="label">Delivery revenue (seeded window)</div><div class="value">${eur(total)}</div></div>
      <div class="card"><div class="label">Wolt</div><div class="value small">${eur(woltGross)}</div></div>
      <div class="card"><div class="label">Uber Eats</div><div class="value small">${eur(ueGross)}</div></div>
      <div class="card"><div class="label">Lieferando</div><div class="value small">${eur(lfGross)}</div></div>
    </div>
    <div class="chart-wrap"><canvas id="revChart" role="img" aria-label="Revenue by platform and period"></canvas></div>
  `;

  const labels = [...new Set([...wolt.map(p=>p.period_to), ...ue.map(p=>p.period_to), ...lf.map(p=>p.period_to)])].sort();
  const byPlatform = (arr, dateKey, valKey) => labels.map(l => { const m = arr.find(p=>p[dateKey]===l); return m ? m[valKey] : null; });

  new Chart(document.getElementById('revChart'), {
    type:'bar',
    data:{ labels,
      datasets:[
        {label:'Wolt', data:byPlatform(wolt,'period_to', null).map((_,i)=>{const m=wolt.find(p=>p.period_to===labels[i]); return m? m.goods_gross+m.deliveries_gross+m.service_gross+m.discounts_gross+m.purchase_corr_gross+m.deductions_gross : 0;}), backgroundColor:'#22c58f'},
        {label:'Uber Eats', data:labels.map(l=>{const m=ue.find(p=>p.period_to===l); return m? m.gross_after_discount : 0;}), backgroundColor:'#e0b04c'},
        {label:'Lieferando', data:labels.map(l=>{const m=lf.find(p=>p.period_to===l); return m? m.period_total_revenue : 0;}), backgroundColor:'#4c9be0'},
      ]},
    options:{responsive:true,maintainAspectRatio:false,
      scales:{x:{stacked:true,ticks:{color:'#8b93a3'},grid:{color:'#262b38'}},y:{stacked:true,ticks:{color:'#8b93a3'},grid:{color:'#262b38'}}},
      plugins:{legend:{labels:{color:'#e9edf3'}}}}
  });
}

// ---------- Kassenbuch ----------
function renderKassenbuch(){
  const el = document.getElementById('kassenbuch');
  const books = SEED.kassenbuch;
  let html = `<div class="row"><select id="bookSel"><option value="restaurant">Restaurant</option><option value="foodtruck">Foodtruck</option><option value="tollwood">Tollwood</option></select></div><div id="bookBody"></div>`;
  el.innerHTML = html;
  function draw(){
    const key = document.getElementById('bookSel').value;
    const book = books[key];
    const body = document.getElementById('bookBody');
    if(!book.entries.length){ body.innerHTML = `<div class="empty">${book.note}</div>`; return; }
    const total = book.entries.filter(e=>e.type==='Einnahme').reduce((s,e)=>s+e.gross,0);
    body.innerHTML = `
      <div class="grid"><div class="card"><div class="label">Summe Bareinnahmen (Zeitraum)</div><div class="value">${eur(total)}</div></div></div>
      <table><thead><tr><th>Datum</th><th>Plattform</th><th>Typ</th><th class="right">Brutto</th><th class="right">Netto</th><th class="right">USt</th><th>Notiz</th></tr></thead><tbody>
      ${book.entries.map(e=>`<tr>
        <td>${e.date}</td><td>${e.platform}</td>
        <td><span class="pill ${e.type==='Einnahme'?'in':'out'}">${e.type}</span></td>
        <td class="right">${eur(e.gross)}</td><td class="right">${eur(e.net)}</td><td class="right">${eur(e.vat)}</td>
        <td style="color:var(--muted);font-size:12px;">${e.note}</td>
      </tr>`).join('')}
      </tbody></table>`;
  }
  document.getElementById('bookSel').addEventListener('change', draw);
  draw();
}

// ---------- DATEV ----------
function buildDatevRows(){
  return SEED.kassenbuch.restaurant.entries.filter(e=>e.type==='Einnahme');
}
function ddmm(iso){ const [y,m,d]=iso.split('-'); return d+m; }
function deAmt(n){ return n.toFixed(2).replace('.',','); }
function csvRow(arr){ return arr.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(';'); }

function generateDatev(){
  const rows = buildDatevRows();
  const from = rows.length? rows[0].date.replace(/-/g,'') : '';
  const to = rows.length? rows[rows.length-1].date.replace(/-/g,'') : '';
  const header = ["EXTF",700,21,"Buchungsstapel",7,from,"","RE","COT-Dashboard","","0","0", from.slice(0,4)+"0101","1600",from,to,`COT ${from}-${to}`,"",1,0,0,"EUR","","","","",""];
  const cols = ["Umsatz (ohne Soll/Haben-Kz)","Soll/Haben-Kennzeichen","WKZ Umsatz","Kurs","Basis-Umsatz","WKZ Basis-Umsatz","Konto","Gegenkonto (ohne BU-Schlüssel)","BU-Schlüssel","Belegdatum","Belegfeld 1","Belegfeld 2","Skonto","Buchungstext","Postensperre","Diverse Adressnummer","Geschäftspartnerbank","Sachverhalt","Zinssperre","Beleglink","Beleginfo - Art 1","Beleginfo - Inhalt 1","Beleginfo - Art 2","Beleginfo - Inhalt 2","Beleginfo - Art 3","Beleginfo - Inhalt 3","Beleginfo - Art 4","Beleginfo - Inhalt 4","Beleginfo - Art 5","Beleginfo - Inhalt 5","Beleginfo - Art 6","Beleginfo - Inhalt 6","Beleginfo - Art 7","Beleginfo - Inhalt 7","Beleginfo - Art 8","Beleginfo - Inhalt 8"];
  let out = csvRow(header) + "\r\n" + csvRow(cols) + "\r\n";
  rows.forEach(e=>{
    const line = ["Umsatz (ohne Soll/Haben-Kz)","Soll/Haben-Kennzeichen","WKZ Umsatz","Kurs","Basis-Umsatz","WKZ Basis-Umsatz","Konto","Gegenkonto (ohne BU-Schlüssel)","BU-Schlüssel","Belegdatum","Belegfeld 1","Belegfeld 2"].map(()=> "");
    const rec = {};
    rec["Umsatz (ohne Soll/Haben-Kz)"]=deAmt(e.gross); rec["Soll/Haben-Kennzeichen"]="S"; rec["Konto"]="1600";
    rec["Gegenkonto (ohne BU-Schlüssel)"]="8300"; rec["Belegdatum"]=ddmm(e.date); rec["Belegfeld 1"]=e.platform;
    rec["Buchungstext"]=e.note.slice(0,60);
    out += csvRow(cols.map(c=>rec[c]!==undefined?rec[c]:"")) + "\r\n";
  });
  return out;
}

function renderDatev(){
  const el = document.getElementById('datev');
  const rows = buildDatevRows();
  el.innerHTML = `
    <p style="color:var(--muted);font-size:13px;">EXTF v700 Buchungsstapel — same format the original app produced. Postings shown are the Einnahme side only (Geldtransit offsets zero out Kassenbestand and aren't separately DATEV-booked). SumUp entries pending — export will grow once that's parsed. Confirm account numbers (1600 Kasse / 8300 Erlöse 7%) with Herr Steuer before filing.</p>
    <div class="row"><button id="dlBtn">Download DATEV CSV (${rows.length} Buchungssätze)</button></div>
    <table><thead><tr><th>Belegdatum</th><th>Konto</th><th>Gegenkonto</th><th class="right">Umsatz</th><th>Buchungstext</th></tr></thead><tbody>
    ${rows.map(e=>`<tr><td>${e.date}</td><td>1600</td><td>8300</td><td class="right">${eur(e.gross)}</td><td style="color:var(--muted);font-size:12px;">${e.note}</td></tr>`).join('')}
    </tbody></table>
  `;
  document.getElementById('dlBtn').addEventListener('click', ()=>{
    const csv = generateDatev();
    const blob = new Blob([csv], {type:'text/csv;charset=windows-1252'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'EXTF_Buchungsstapel_COT.csv';
    a.click();
  });
}

function renderSources(){
  const el = document.getElementById('sources');
  const c = SEED.manifest.coverage;
  el.innerHTML = `
    <table><thead><tr><th>Platform</th><th>Status</th><th>Coverage</th><th>Note</th></tr></thead><tbody>
      <tr><td>Wolt</td><td><span class="pill in">seeded</span></td><td>${c.wolt.from} → ${c.wolt.to} (${c.wolt.periods_parsed} periods)</td><td></td></tr>

      <tr><td>SumUp Restaurant</td><td><span class="pill in">seeded</span></td><td>${c.sumup.restaurant_range[0]} → ${c.sumup.restaurant_range[1]} (${c.sumup.restaurant_days} days)</td><td style="color:var(--muted);font-size:12px;">${c.sumup.reason}</td></tr>

  `;
}
